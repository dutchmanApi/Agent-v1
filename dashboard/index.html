<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Factory</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--line:#28344e;--text:#e5edf8;--muted:#9aa9bf;--accent:#62c4e8}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}header,.actions,.tabs{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:20px}h1{font-size:1.35rem;margin:0;color:var(--accent)}p{color:var(--muted);margin:.3rem 0}button{background:#1c2942;color:var(--text);border:1px solid #45617e;border-radius:7px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:18px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:15px}.metric{font-size:1.5rem;color:var(--accent);font-weight:700}.label{font-size:.78rem;color:var(--muted);text-transform:uppercase}.tabs{margin:18px 0}.tab.active{background:var(--accent);color:#06111c}section.panel{margin-bottom:14px}.entry{padding:13px 0;border-bottom:1px solid var(--line)}.entry:last-child{border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#090d16;padding:12px;border-radius:6px;max-height:420px;overflow:auto;color:#cad8e8}.hidden{display:none}small{color:var(--muted)}
</style></head><body>
<header><div><h1>Autonomous Browser Factory</h1><p>Skills, browser recovery, rollout quality, and local training status</p></div><div class="actions"><button onclick="job('worker:m1')">Run local worker</button><button onclick="job('harvest:ci')">Run Gemini harvester</button><button onclick="job('train:m1')">Train on this Mac</button><button onclick="refresh()">Refresh</button></div></header>
<div id="metrics" class="grid"></div><section class="panel"><b>Worker activity</b><div id="job"></div><pre id="logs">No recent activity.</pre></section>
<nav class="tabs"><button class="tab active" onclick="show('skills',this)">Skills</button><button class="tab" onclick="show('rollouts',this)">Rollouts</button><button class="tab" onclick="show('failures',this)">Recovered failures</button><button class="tab" onclick="show('state',this)">Implementation state</button></nav>
<section id="skills" class="panel"></section><section id="rollouts" class="panel hidden"></section><section id="failures" class="panel hidden"></section><section id="state" class="panel hidden"></section>
<script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(id,button){document.querySelectorAll('body>section.panel').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));button.classList.add('active')}
async function job(name){const r=await fetch('/api/trigger',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jobType:name})});const d=await r.json();alert(d.message);refresh()}
function list(items,render,empty){return items.length?items.map(x=>'<article class="entry">'+render(x)+'</article>').join(''):'<p>'+empty+'</p>'}
async function refresh(){try{const d=await(await fetch('/api/telemetry')).json();document.getElementById('metrics').innerHTML=Object.entries(d.metrics).map(([k,v])=>'<div class="card"><div class="label">'+esc(k)+'</div><div class="metric">'+esc(v)+'</div></div>').join('');document.getElementById('job').textContent=d.activeJob||'No job running';document.getElementById('logs').textContent=d.logs.join('\n')||'No recent activity.';
document.getElementById('skills').innerHTML=list(d.skills,s=>'<b>'+esc(s.skill_id)+'</b> — '+esc(s.task_prompt)+'<p><small>'+esc(s.url)+' | '+esc(s.verified_selector)+'</small></p><pre>'+esc(s.code)+'</pre>','No verified skills yet.');
document.getElementById('rollouts').innerHTML=list(d.rollouts,r=>'<b>'+esc(r.task_prompt)+'</b><p><small>Rewards: '+esc((r.verifier_rewards||[]).join(', '))+' | Selector: '+esc(r.verified_selector)+'</small></p><pre>'+esc((r.candidate_completions||[])[0]||'')+'</pre>','No rollout groups yet.');
document.getElementById('failures').innerHTML=list(d.failures,f=>'<b>'+esc(f.task)+'</b><p><small>'+esc(f.root_cause||f.error)+'</small></p><pre>'+esc(f.verified_recovery_completion)+'</pre>','No verified recoveries yet.');document.getElementById('state').innerHTML='<pre>'+esc(d.state)+'</pre>'}catch(e){document.getElementById('logs').textContent='Dashboard refresh failed: '+e}}
refresh();setInterval(refresh,5000);
</script></body></html>
